[package]
name = "graviz"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[[bin]]
name = "graviz"
path = "src/bin/graviz.rs"

[[bin]]
name = "graviz-bench"
path = "src/bin/graviz-bench.rs"
