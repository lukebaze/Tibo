[package]
name = "tibo"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[[bin]]
name = "tibo"
path = "src/bin/tibo.rs"

[[bin]]
name = "tibo-bench"
path = "src/bin/tibo-bench.rs"

[[bin]]
name = "tibo-web"
path = "src/bin/tibo-web.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
